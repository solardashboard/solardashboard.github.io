<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votre simulation solaire — SolarDashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sun: #f59e0b; --sun-dark: #d97706;
      --dark: #0f172a; --dark-2: #1e293b; --dark-3: #334155;
      --text: #f1f5f9; --muted: #94a3b8;
      --green: #16a34a; --green-2: #4ade80; --green-bg: #052e16;
    }
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP BAR ── */
    .topbar {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.7rem 1.25rem;
      background: rgba(15,23,42,0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0; z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 0.45rem; font-weight: 800; font-size: 0.92rem; text-decoration: none; color: var(--text); }
    .logo-icon { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; }
    .topbar-sep { color: var(--dark-3); }
    .topbar-title { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .topbar-right { margin-left: auto; }
    .share-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); font-size: 0.73rem; font-weight: 600;
      padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .share-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .share-btn.copied { color: var(--green-2); border-color: var(--green); }

    /* ── GRID ── */
    main {
      flex: 1; display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      max-width: 860px; width: 100%;
      margin: 0 auto; padding: 1.5rem 1.25rem;
      align-items: start;
    }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; gap: 1rem; padding: 1rem; }
    }

    /* ── LEFT PANEL ── */
    .left-col { display: flex; flex-direction: column; gap: 0.85rem; }

    .photo-wrap {
      position: relative; border-radius: 16px; overflow: hidden;
      background: var(--dark-2); aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,0.07);
    }
    @media (max-width: 640px) {
      .photo-wrap { aspect-ratio: 4/3; }
    }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-placeholder {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 0.4rem; color: var(--muted); font-size: 0.75rem; text-align: center;
    }
    .photo-placeholder span { font-size: 2rem; }
    .photo-marker {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -100%);
      pointer-events: none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }

    /* Centrale card */
    .centrale-card {
      background: var(--dark-2); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 1rem 1.1rem;
    }
    .centrale-kwc { font-size: 0.85rem; color: var(--muted); line-height: 1.55; }
    .centrale-kwc strong { color: var(--text); font-size: 1.5rem; font-weight: 800; display: block; margin-top: 0.2rem; }

    /* ── RIGHT PANEL ── */
    .right-col { display: flex; flex-direction: column; gap: 1.1rem; }

    .right-title {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted);
    }

    /* Inputs */
    .inputs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 400px) { .inputs-row { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
    .field-hint { font-size: 0.63rem; color: var(--dark-3); }

    .input-wrap { display: flex; align-items: stretch; }
    .input-wrap input[type="number"] {
      flex: 1; min-width: 0;
      background: var(--dark-3); border: 1px solid rgba(255,255,255,0.1); border-right: none;
      border-radius: 8px 0 0 8px; color: var(--text);
      font-size: 1.1rem; font-weight: 700; font-family: inherit;
      padding: 0.65rem 0.75rem; outline: none; transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .input-wrap input[type="number"]::-webkit-outer-spin-button,
    .input-wrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .input-wrap input[type="number"]:focus { border-color: rgba(245,158,11,0.5); }

    .input-unit {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0 8px 8px 0; padding: 0 0.7rem;
      font-size: 0.7rem; font-weight: 600; color: var(--muted); white-space: nowrap;
      display: flex; align-items: center;
    }

    /* Stepper buttons */
    .steppers { display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); border-left: none; border-radius: 0 8px 8px 0; overflow: hidden; }
    .stepper-btn {
      flex: 1; background: rgba(255,255,255,0.04); border: none;
      color: var(--muted); cursor: pointer; font-size: 0.7rem; font-family: inherit;
      padding: 0 0.55rem; line-height: 1; transition: background 0.12s, color 0.12s;
      min-width: 28px;
    }
    .stepper-btn:hover { background: rgba(245,158,11,0.15); color: var(--sun); }
    .stepper-btn:first-child { border-bottom: 1px solid rgba(255,255,255,0.08); }

    /* KPI duo hero */
    .kpi-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .kpi-hero { border-radius: 14px; padding: 1.1rem 1.15rem; }
    .kpi-hero.kpi-eco     { background: var(--green-bg); border: 1px solid rgba(22,163,74,0.4); }
    .kpi-hero.kpi-payback { background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.25); }

    .kpi-hero-label {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; margin-bottom: 0.2rem;
    }
    .kpi-hero.kpi-eco .kpi-hero-label     { color: var(--green-2); }
    .kpi-hero.kpi-payback .kpi-hero-label { color: var(--sun); }

    .kpi-hero-val {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
      word-break: break-all;
    }
    @media (max-width: 400px) { .kpi-hero-val { font-size: 1.6rem; } }
    .kpi-hero.kpi-eco .kpi-hero-val     { color: var(--green-2); }
    .kpi-hero.kpi-payback .kpi-hero-val { color: var(--sun); }
    .kpi-hero-val.flash { animation: flash 0.3s ease; }
    @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .kpi-hero-sub { font-size: 0.64rem; margin-top: 0.3rem; }
    .kpi-hero.kpi-eco .kpi-hero-sub     { color: #86efac; }
    .kpi-hero.kpi-payback .kpi-hero-sub { color: rgba(245,158,11,0.65); }

    /* Sweet spot */
    .sweetspot-wrap {
      background: var(--dark-2); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 0.85rem 1rem;
    }
    .sweetspot-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem;
    }
    .sweetspot-title { font-size: 0.68rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .sweetspot-label { font-size: 0.72rem; font-weight: 700; transition: color 0.4s; }
    .sweetspot-bar-bg {
      height: 8px; background: rgba(255,255,255,0.06);
      border-radius: 99px; overflow: hidden;
    }
    .sweetspot-bar-fill {
      height: 100%; border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1), background 0.5s;
    }
    .sweetspot-sub { font-size: 0.62rem; color: var(--muted); margin-top: 0.45rem; line-height: 1.5; }

    /* CTA */
    .cta-wrap { display: flex; flex-direction: column; gap: 0.6rem; }
    .cta-btn {
      background: linear-gradient(135deg, var(--green), #15803d);
      color: #fff; font-weight: 700; font-size: 1rem;
      padding: 0.9rem 1.5rem; border-radius: 12px;
      border: none; cursor: pointer; font-family: inherit;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(22,163,74,0.35);
    }
    .cta-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .cta-btn:disabled { opacity: 0.55; cursor: default; transform: none; }
    .cta-btn.sent { background: linear-gradient(135deg,#065f46,#047857); }
    .cta-proof { font-size: 0.67rem; color: var(--muted); text-align: center; line-height: 1.6; }
    .cta-proof strong { color: var(--text); font-weight: 600; }
    .cta-spinner {
      width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 0.9rem 1.25rem; text-align: center;
      color: var(--muted); font-size: 0.7rem;
    }
    footer a { color: var(--muted); text-decoration: underline; }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--muted); }
    .empty-state span { font-size: 2rem; display: block; margin-bottom: 0.6rem; }
  </style>

  <script src="../consent.js" defer></script>
</head>
<body>

  <div class="topbar">
    <a href="../" class="logo">
      <img src="../assets/icon.png" class="logo-icon" alt="SolarDashboard" />
      SolarDashboard
    </a>
    <div class="topbar-sep">/</div>
    <div class="topbar-title">Simulation solaire</div>
    <div class="topbar-right">
      <button class="share-btn" id="shareBtn" onclick="copyLink()">🔗 Copier le lien</button>
    </div>
  </div>

  <main id="main"></main>

  <footer>
    Simulation générée par <strong>SolarDashboard</strong> — résultats indicatifs ·
    <a href="faq.html">Comment c'est calculé ?</a> ·
    <a href="../legal.html">Mentions légales</a>
  </footer>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const WEB3FORMS_KEY = '44a824bd-fd6b-454e-80a5-c3b5c5519a56';

// ── URL params ───────────────────────────────────────────────────────────────
const P        = new URLSearchParams(window.location.search);
const pKwp     = parseFloat(P.get('kwp'))     || 0;     // kWp — puissance installée
const pProd    = parseFloat(P.get('prod'))    || 0;     // MWh/an — production annuelle
const pFacture = parseFloat(P.get('facture')) || 0;     // €/an HT — facture électricité initiale
const pConso   = parseFloat(P.get('conso'))   || 0;     // MWh/an — consommation (cap autoconsommation)
const pLat     = parseFloat(P.get('lat'))     || null;
const pLon     = parseFloat(P.get('lon'))     || null;
const pId      = P.get('id')                  || null;

// ── Constantes ───────────────────────────────────────────────────────────────
const AUTOCONSO_CI   = 0.70;   // taux moyen autoconsommation C&I constaté
const CA_PER_KWC     = 1.1;    // k€/kWp — coût installation C&I moyen
const HAUSSE_DEFAULT = 0.03;   // +3 %/an hausse prix électricité
const DEGR           = 0.007;  // 0.7 %/an dégradation panneaux
const IGN_WMS        = 'https://data.geopf.fr/wms-r';
const IGN_LAYER      = 'ORTHOIMAGERY.ORTHOPHOTOS';

// ── IGN photo ────────────────────────────────────────────────────────────────
function ignUrl(lat, lon, px) {
  const buf = 0.0012;
  return `${IGN_WMS}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap`
       + `&LAYERS=${IGN_LAYER}&STYLES=&FORMAT=image/jpeg&CRS=EPSG:4326`
       + `&BBOX=${lat-buf},${lon-buf},${lat+buf},${lon+buf}`
       + `&WIDTH=${px}&HEIGHT=${px}`;
}

// ── Formatage ────────────────────────────────────────────────────────────────
// Montant plein : "8 432 €"
function fmtEuros(euros) {
  return Math.round(euros).toLocaleString('fr') + ' €';
}
// Payback décimal : "7,3 ans"
function fmtPayback(val) {
  if (!val || val > 50) return '> 25 ans';
  return val.toFixed(1).replace('.', ',') + ' ans';
}

// ── Sweet spot : score 0–100 basé sur le payback ─────────────────────────────
// payback ≤ 5 → 100 | payback 10 → 67 | payback 15 → 33 | payback ≥ 20 → 5
function sweetScore(payback) {
  if (!payback || payback > 50) return 5;
  return Math.max(5, Math.min(100, Math.round((20 - payback) / 15 * 100)));
}
function sweetColor(score) {
  if (score >= 75) return '#22c55e';
  if (score >= 55) return '#84cc16';
  if (score >= 38) return '#eab308';
  if (score >= 20) return '#f97316';
  return '#ef4444';
}
function sweetLabel(score) {
  if (score >= 75) return { text: 'Excellent potentiel', color: '#22c55e' };
  if (score >= 55) return { text: 'Très intéressant',    color: '#84cc16' };
  if (score >= 38) return { text: 'Potentiel modéré',    color: '#eab308' };
  return            { text: 'Profil moins favorable',   color: '#f97316' };
}
function sweetSub(score, payback) {
  if (!payback || payback > 50) return 'Ajustez les paramètres pour affiner le résultat.';
  if (score >= 75) return `En ${fmtPayback(payback)}, l'installation est amortie — et vous fixez une part de votre coût énergie pour 25 ans, quoi qu'il arrive sur les tarifs réseau.`;
  if (score >= 55) return `Un payback de ${fmtPayback(payback)} sur des charges que vous payez de toute façon. Et chaque hausse tarifaire future améliore mécaniquement ce chiffre.`;
  if (score >= 38) return `Le projet reste intéressant — d'autant que la volatilité des prix de l'électricité joue en votre faveur sur la durée. Ajustez votre facture réelle pour affiner.`;
  return `Le profil actuel est moins favorable. Vérifiez que votre facture reflète bien votre coût réel, ou contactez-nous pour explorer d'autres configurations.`;
}

// ── Calcul principal ──────────────────────────────────────────────────────────
function calc() {
  const facture = parseFloat(document.getElementById('fFacture')?.value) || 0;

  if (pKwp <= 0 || pProd <= 0 || facture <= 0 || pConso <= 0) {
    document.getElementById('rEco').textContent     = '—';
    document.getElementById('rPayback').textContent = '—';
    updateSweet(null);
    return;
  }

  // Prix unitaire implicite déduit de la facture prospect
  const prixElec  = facture / pConso;   // €/MWh
  const invest    = pKwp * CA_PER_KWC * 1000;
  const enAutoAn1 = Math.min(pProd * AUTOCONSO_CI, pConso);
  const ecoAn1    = enAutoAn1 * prixElec;

  // Payback avec interpolation décimale
  let cumul = 0, payback = null;
  for (let t = 0; t < 50; t++) {
    const prixT = prixElec * Math.pow(1 + HAUSSE_DEFAULT, t);
    const prodT = pProd * Math.pow(1 - DEGR, t);
    const ecoT  = Math.min(prodT * AUTOCONSO_CI, pConso) * prixT;
    if (cumul + ecoT >= invest) {
      payback = t + (invest - cumul) / ecoT;
      break;
    }
    cumul += ecoT;
  }

  flash('rEco');
  flash('rPayback');
  document.getElementById('rEco').textContent     = fmtEuros(ecoAn1) + '/an';
  document.getElementById('rPayback').textContent = fmtPayback(payback);
  updateSweet(payback);
}

function flash(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function updateSweet(payback) {
  const score   = sweetScore(payback);
  const color   = sweetColor(score);
  const lbl     = sweetLabel(score);
  const sub     = sweetSub(score, payback);

  const fill = document.getElementById('sweetFill');
  const lblEl = document.getElementById('sweetLabel');
  const subEl = document.getElementById('sweetSub');
  if (!fill) return;

  fill.style.width      = score + '%';
  fill.style.background = color;
  if (lblEl) { lblEl.textContent = lbl.text; lblEl.style.color = lbl.color; }
  if (subEl) subEl.textContent = sub;
}

// ── Stepper ───────────────────────────────────────────────────────────────────
function step(id, delta) {
  const el = document.getElementById(id);
  if (!el) return;
  const val = parseFloat(el.value) || 0;
  el.value = Math.max(parseFloat(el.min) || 0, val + delta);
  calc();
}

// ── Envoi Web3Forms ───────────────────────────────────────────────────────────
async function sendLead() {
  const btn         = document.getElementById('ctaBtn');
  const factureVal  = document.getElementById('fFacture').value;
  const payback     = document.getElementById('rPayback').textContent;
  const eco         = document.getElementById('rEco').textContent;

  const factureModif = parseFloat(factureVal) !== pFacture;
  const id           = pId || '(non renseigné)';

  btn.disabled = true;
  btn.innerHTML = `<span class="cta-spinner"></span> Envoi…`;

  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        access_key:          WEB3FORMS_KEY,
        subject:             `Résultat prospection client ${id}`,
        from_name:           'SolarDashboard',
        'ID prospect':       id,
        'Puissance':         `${pKwp} kWp`,
        'Production':        `${pProd} MWh/an`,
        'Consommation':      `${pConso} MWh/an`,
        'Facture annuelle':  `${factureVal} €/an HT${factureModif ? ' ✏️ modifiée' : ''}`,
        'Prix élec implicite': `${Math.round(parseFloat(factureVal) / pConso)} €/MWh`,
        'Économies an 1':    eco,
        'Payback':           payback,
        'Lat / Lon':         `${pLat || '—'} / ${pLon || '—'}`,
        'URL simulation':    window.location.href,
      }),
    });
    const data = await res.json();
    if (data.success) {
      btn.classList.add('sent');
      btn.innerHTML = '✅ Message envoyé — à bientôt !';
    } else throw new Error(data.message);
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = '⚠️ Erreur — réessayer';
    setTimeout(() => { btn.innerHTML = '✉️ Je suis intéressé →'; }, 3000);
  }
}

// ── Copie lien ────────────────────────────────────────────────────────────────
function copyLink() {
  const u = new URL(window.location.href);
  u.searchParams.set('kwp',     pKwp);
  u.searchParams.set('prod',    pProd);
  u.searchParams.set('facture', pFacture);
  u.searchParams.set('conso',   pConso);
  if (pLat) u.searchParams.set('lat', pLat);
  if (pLon) u.searchParams.set('lon', pLon);
  if (pId)  u.searchParams.set('id',  pId);
  navigator.clipboard.writeText(u.toString()).then(() => {
    const btn = document.getElementById('shareBtn');
    btn.textContent = '✅ Copié !'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '🔗 Copier le lien'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('main');

  if (!pLat || !pLon || pKwp <= 0 || pProd <= 0) {
    main.innerHTML = `<div class="empty-state">
      <span>🔍</span>
      <p>Paramètres manquants.<br/>
      <code style="font-size:0.7rem">?kwp=50&prod=67&facture=12800&conso=80&lat=45.744&lon=4.731&id=CLIENT_001</code></p>
    </div>`;
    return;
  }

  main.innerHTML = `

    <!-- ── COLONNE GAUCHE ── -->
    <div class="left-col">
      <div class="photo-wrap">
        <img src="${ignUrl(pLat, pLon, 560)}" alt="Vue aérienne"
             onerror="this.style.display='none';document.getElementById('photoPlaceholder').style.display='flex'" />
        <div class="photo-placeholder" id="photoPlaceholder"><span>🛰️</span><p>Vue satellite indisponible</p></div>
        <div class="photo-marker">
          <svg width="30" height="38" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 22 14 22S28 23.33 28 14C28 6.27 21.73 0 14 0z" fill="#f59e0b" opacity="0.95"/>
            <circle cx="14" cy="14" r="5.5" fill="#fff"/>
          </svg>
        </div>
      </div>

      <div class="centrale-card">
        <div class="centrale-kwc">
          Vous pourriez installer jusqu'à
          <strong>${pKwp.toLocaleString('fr')} kWp</strong>
          de panneaux solaires
        </div>
      </div>
    </div>

    <!-- ── COLONNE DROITE ── -->
    <div class="right-col">
      <div class="right-title">Affinez votre simulation</div>

      <div class="field">
        <label>Votre facture d'électricité annuelle</label>
        <div class="input-wrap">
          <input type="number" id="fFacture" min="0" step="1000" value="${pFacture || ''}" oninput="calc()" />
          <div class="steppers">
            <button class="stepper-btn" onclick="step('fFacture', 1000)">▲</button>
            <button class="stepper-btn" onclick="step('fFacture', -1000)">▼</button>
          </div>
          <span class="input-unit">€/an HT</span>
        </div>
        <div class="field-hint">ajustez d'après votre dernière facture</div>
      </div>
